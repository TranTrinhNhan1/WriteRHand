<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var t
        try {
          t = localStorage.getItem('writerhand-theme')
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="description" content="Năm bộ phân loại tự cài đặt cho môn Nhận dạng, huấn luyện trên MNIST, Fashion-MNIST và EMNIST Digits. Vẽ hoặc chọn một ảnh test và xem từng mô hình đọc nó ngay trong trình duyệt, kèm phép tính thật bên trong." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WriteRHand" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="WriteRHand: năm bộ phân loại chữ số viết tay, chạy trong trình duyệt" />
    <meta property="og:description" content="Năm bộ phân loại tự cài đặt cho môn Nhận dạng, huấn luyện trên MNIST, Fashion-MNIST và EMNIST Digits. Vẽ hoặc chọn một ảnh test và xem từng mô hình đọc nó ngay trong trình duyệt, kèm phép tính thật bên trong." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>WriteRHand</title>
  </head>

    <div id="root"></div>
    <noscript>WriteRHand cần JavaScript để chạy các bộ phân loại trong trình duyệt. WriteRHand needs JavaScript to run the classifiers in your browser.</noscript>

  </body>
</html>
