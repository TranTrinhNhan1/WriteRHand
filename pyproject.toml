[project]
name = "writerhand"
version = "0.1.0"
description = "Handwritten digit (MNIST) classification with from-scratch classifiers: Gaussian NB, softmax regression, MLP, AdaBoost-SAMME."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TranTrinhNhan", email = "trantrinhan1312@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
track = ["wandb>=0.17"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "huggingface_hub>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29", "nbclient>=0.10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: tests that train on larger subsets (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "graphify-out", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
