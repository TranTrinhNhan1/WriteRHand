name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "report/**"
      - "slides/**"
      - "results/figures/**"
      - "docs/pdf-stamps.json"
      - "scripts/docs_stamp.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: The committed PDFs must be built from the committed sources
        working-directory: .
        run: python3 scripts/docs_stamp.py check
      - name: poppler-utils (page counts for the Documents page)
        run: command -v pdfinfo || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Pinned bundle must match the committed manifest and the remote revision
        run: npm run bundle:check
      - run: npm run build
        env:
          VITE_BASE: /WriteRHand/
          # production fetches the revision pinned in web/model-lock.json from Hugging Face
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
