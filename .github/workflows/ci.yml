name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests, smoke run)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra export --extra track --group dev
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Unit tests
        run: uv run pytest tests
      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data/MNIST
          key: mnist-raw-v1
      - name: Smoke pipeline (tiny subset, CPU, no W&B)
        run: |
          set -e
          out="$RUNNER_TEMP/smoke"
          uv run python -m src prepare
          uv run python -m src tune --model all --smoke --wandb disabled --results-dir "$out"
          uv run python -m src train --model all --smoke --wandb disabled --results-dir "$out" --artifacts-dir "$out/art"
          uv run python -m src baselines --model all --smoke --results-dir "$out"
          uv run python -m src export --results-dir "$out" --artifacts-dir "$out/art"
          test -f "$out/art/bundle/manifest.json"

  web:
    name: Web (typecheck, parity tests, build, browser E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Pinned bundle (committed manifest, model-lock.json and Hugging Face revision must agree)
        run: npm run bundle:check
      - name: Fetch the pinned bundle (every file verified against its SHA-256)
        run: npm run bundle:fetch
      - name: Unit and parity tests (a missing bundle is a failure, not a skip)
        run: npm test
        env:
          REQUIRE_BUNDLE: "1"
      - run: npm run build
        env:
          VITE_BASE: /WriteRHand/
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (browser, built site, pinned bundle served locally)
        run: npm run test:e2e
        env:
          REQUIRE_BUNDLE: "1"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
